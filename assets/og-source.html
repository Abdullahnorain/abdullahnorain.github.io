<!doctype html>
<!-- Source for assets/og-image.jpg (1200x630). Regenerate from the project root with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu --hide-scrollbars \
       --force-prefers-reduced-motion --virtual-time-budget=6000 --window-size=1200,630 \
       --screenshot="$PWD/assets/og.png" "file://$PWD/assets/og-source.html"
     then: sips -s format jpeg -s formatOptions 88 assets/og.png --out assets/og-image.jpg && rm assets/og.png -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share image source</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="products.css">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; background: #f8f5fa; color: #111014; font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .grid { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(217,255,47,.10), transparent 30%), linear-gradient(28deg, rgba(108,0,193,.07), transparent 48%); }
  .grid::before { content: ""; position: absolute; inset: 0; opacity: .8;
    background: radial-gradient(circle at 4px 4px, rgba(108,0,193,.05) 1px, transparent 1.35px), linear-gradient(90deg, rgba(17,16,20,.05) 1px, transparent 1px), linear-gradient(0deg, rgba(17,16,20,.04) 1px, transparent 1px);
    background-size: 8px 8px, 176px 118px, 176px 118px; }
  .grid::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(108,0,193,.16) 1px, transparent 1px), linear-gradient(0deg, rgba(108,0,193,.12) 1px, transparent 1px); background-size: 176px 118px;
    -webkit-mask-image: radial-gradient(360px circle at 900px 300px, rgba(0,0,0,.7), transparent 70%); mask-image: radial-gradient(360px circle at 900px 300px, rgba(0,0,0,.7), transparent 70%); }
  .text { position: absolute; left: 72px; top: 64px; width: 600px; }
  .who { margin: 0; font-size: 22px; line-height: 1.35; }
  .who b { font-weight: 700; }
  .who span { display: block; color: #5f5d68; }
  h1 { margin: 34px 0 0; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 76px; line-height: .98; letter-spacing: -0.015em; }
  .building { position: absolute; left: 72px; bottom: 62px; display: flex; align-items: center; gap: 26px; font-size: 20px; }
  .building .lbl { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 26px; color: #5f5d68; }
  .prod { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .prod svg, .prod img { width: 34px; height: 34px; border-radius: 9px; display: block; }
  .prod--ac span { font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .1em; font-size: 18px; }
  .prod--jr span { font-family: "DM Sans", "Geist", sans-serif; font-size: 21px; }
  .prod--jr i { font-family: "Libre Baskerville", Georgia, serif; color: #6c00c1; font-weight: 400; }
  .fan { position: absolute; left: 700px; top: 26px; width: 470px; }
  .fan .ac-fan-zone { cursor: default; }
  .fan .ac-fan-rivet { display: none; }
  .phone { position: absolute; left: 912px; top: 262px; width: 206px; transform: rotate(4deg); border-radius: 30px; overflow: hidden; line-height: 0; background: #141216; box-shadow: 0 30px 70px rgba(28,16,52,.32), 0 0 0 1px rgba(17,16,20,.1); }
  .phone img { width: 100%; display: block; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="text">
  <p class="who"><b>Abdullah A. Norain, MD</b><span>Diagnostic radiology resident and healthtech builder</span></p>
  <h1>I read scans by day and build software for physicians.</h1>
</div>
<div class="fan ac-world ac-flat"><div class="ac-stage" data-ac-stage><div class="ac-fan-zone" data-ac-fan data-max-scale="0.5"></div></div></div>
<div class="phone"><img src="jr-native-feed.jpg" alt=""></div>
<div class="building">
  <span class="lbl">Now building</span>
  <span class="prod prod--ac"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="1.5" y="1.5" width="45" height="45" rx="10" fill="#0f1b2d" stroke="#29d3e0" stroke-width="2"/><text x="24" y="33" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" font-size="26" fill="#29d3e0">A</text></svg><span>AUNTCORE</span></span>
  <span class="prod prod--jr"><img src="jr-logo.png" alt=""><span>Journal <i>Rounds</i></span></span>
</div>
<script src="products.js"></script>
</body>
</html>
