<!doctype html>
<!-- Source for assets/og-image.png (1200×630). Regenerate with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu --hide-scrollbars \
       --window-size=1200,630 --screenshot=assets/og-image.png "file://$PWD/assets/og-source.html" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image source</title>
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #f8f5fa; color: #16181c; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .card { position: relative; width: 1200px; height: 630px; padding: 64px 72px; box-sizing: border-box; }
  .handle { position: absolute; top: 64px; right: 72px; font-size: 22px; color: #5b616b; font-weight: 500; }
  h1 { margin: 0; font-size: 74px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; }
  h1 span { font-weight: 400; color: #5b616b; }
  .line { margin: 20px 0 0; font-size: 30px; color: #5b616b; line-height: 1.3; }
  .label { margin: 52px 0 14px; font-size: 22px; font-weight: 600; color: #5b616b; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .tile { height: 210px; border-radius: 22px; padding: 26px 28px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
  .head { display: flex; align-items: center; gap: 14px; }
  .mark { width: 48px; height: 48px; border-radius: 11px; display: block; }
  .ac { background: #0c1424; color: #e7edf3; font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        background-image: linear-gradient(rgba(41,211,224,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(41,211,224,.07) 1px, transparent 1px); background-size: 40px 40px; }
  .ac .name { font-size: 26px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .ac .pitch { font-size: 24px; color: #29d3e0; text-transform: uppercase; letter-spacing: .02em; line-height: 1.25; margin: 0; }
  .jr { background: #5b35b5; color: #fff; }
  .jr .name { font-family: ui-serif, "New York", Georgia, serif; font-size: 32px; font-weight: 600; }
  .jr .pitch { font-family: ui-serif, "New York", Georgia, serif; font-size: 27px; font-weight: 600; line-height: 1.25; margin: 0; }
  .jr .mark { box-shadow: 0 0 0 1.5px rgba(255,255,255,.55); }
</style>
</head>
<body>
<div class="card">
  <div class="handle">@AbdullahNorain</div>
  <h1>Abdullah A. Norain, <span>MD</span></h1>
  <p class="line">Diagnostic radiology resident and healthtech builder.</p>
  <p class="label">Now building</p>
  <div class="tiles">
    <div class="tile ac">
      <div class="head">
        <svg class="mark" viewBox="0 0 48 48" width="48" height="48"><rect x="1.5" y="1.5" width="45" height="45" rx="10" fill="#0f1b2d" stroke="#29d3e0" stroke-width="2"/><text x="24" y="33" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="26" fill="#29d3e0">A</text></svg>
        <div class="name">AuntCore</div>
      </div>
      <p class="pitch">Your radiology case books, as a question bank.</p>
    </div>
    <div class="tile jr">
      <div class="head">
        <img class="mark" src="jr-logo.png" alt="" width="48" height="48">
        <div class="name">Journal Rounds</div>
      </div>
      <p class="pitch">Follow medical journals. Read structured AI summaries.</p>
    </div>
  </div>
</div>
</body>
</html>
